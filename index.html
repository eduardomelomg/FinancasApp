<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <meta name="theme-color" content="#22304A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grana" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Grana · suas finanças no controle</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #22304A;
        color: #F6F5F1;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        animation: boot-fade 0.45s ease 1.25s forwards;
      }
      #boot-splash .boot-logo {
        width: 108px;
        height: 108px;
        animation: boot-pop 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #boot-splash .boot-name {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.5px;
        margin: 0;
        animation: boot-rise 0.6s ease 0.1s both;
      }
      #boot-splash .boot-tag {
        font-size: 13px;
        color: #D3A44B;
        margin: 0;
        animation: boot-rise 0.6s ease 0.2s both;
      }
      #boot-splash .boot-bar {
        width: 120px;
        height: 4px;
        border-radius: 999px;
        margin-top: 6px;
        background: rgba(246, 245, 241, 0.18);
        overflow: hidden;
      }
      #boot-splash .boot-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #2E8B7C;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-pop {
        from { transform: scale(0.7); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      @keyframes boot-rise {
        from { transform: translateY(10px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes boot-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      @keyframes boot-fade {
        to { opacity: 0; visibility: hidden; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <svg class="boot-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="112" fill="#2A3A57"/>
        <rect x="120" y="286" width="64" height="90" rx="18" fill="#2E8B7C"/>
        <rect x="224" y="226" width="64" height="150" rx="18" fill="#2E8B7C"/>
        <rect x="328" y="166" width="64" height="210" rx="18" fill="#2E8B7C"/>
        <circle cx="360" cy="150" r="70" fill="#D3A44B"/>
        <text x="360" y="150" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700"
              fill="#22304A" text-anchor="middle" dominant-baseline="central">R$</text>
      </svg>
      <h1 class="boot-name">Grana</h1>
      <p class="boot-tag">seu dinheiro organizado</p>
      <div class="boot-bar"></div>
    </div>
    <div id="root"></div>
    <script>
      // Remove a splash do DOM após a animação de fade (sempre que o app abre).
      setTimeout(function () {
        var s = document.getElementById("boot-splash");
        if (s) s.remove();
      }, 1800);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
