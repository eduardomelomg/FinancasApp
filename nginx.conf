server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compactação básica
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # SPA: qualquer rota cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # PWA: service worker, manifest e index nunca em cache (evita app velho)
  location = /index.html      { add_header Cache-Control "no-cache"; }
  location = /sw.js           { add_header Cache-Control "no-cache"; }
  location = /registerSW.js   { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  # Assets com hash no nome podem cachear forte
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
